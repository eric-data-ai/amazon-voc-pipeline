version: 2

sources:

  - name: voc_raw
    description: "Raw Amazon review data loaded by ETL pipeline"

    database: amazon-voc-pipeline
    schema: voc_raw

    tables:

      - name: review_raw
        description: "Raw Amazon review records from ETL ingestion"

        columns:
          - name: Review_ID
            tests:
              - not_null


  - name: voc_features
    description: "NLP feature tables generated by Amazon VOC NLP pipeline"

    database: amazon-voc-pipeline
    schema: voc_features

    tables:

      - name: review_features
        description: "Review-level NLP keyword features for visualization"

        columns:

          - name: Review_ID
            description: "Unique review identifier"
            tests:
              - not_null

          - name: Keywords
            description: "Extracted keywords used for Power BI word cloud"